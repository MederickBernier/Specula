; Production PHP settings. The defaults in the official image are tuned for
; development, so the ones that matter in production are set explicitly.
expose_php = Off

memory_limit = 256M
upload_max_filesize = 16M
post_max_size = 16M
max_execution_time = 60

; Errors go to the container log, never to the browser.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; The code never changes without a new image, so stat() on every include is
; wasted work. Rebuild and redeploy to pick up changes.
opcache.validate_timestamps = 0
